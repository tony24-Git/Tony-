name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Inject Android Project Files & Complete Resources
        run: |
          # 1. Propriétés Gradle (AndroidX obligatoire)
          cat << 'EOF' > android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # 2. Configuration Gradle racine
          cat << 'EOF' > android/settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TorchApp"
          include(":app")
          EOF

          cat << 'EOF' > android/build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          # 3. Création des dossiers de ressources
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          # 4. Textes & Thèmes
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Lampe Torche</string>
          </resources>
          EOF

          cat << 'EOF' > android/app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.TorchApp" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#0B0F19</item>
                  <item name="android:windowBackground">#0B0F19</item>
              </style>
          </resources>
          EOF

          # 5. Dessinables : fond du bouton et icônes lampe
          cat << 'EOF' > android/app/src/main/res/drawable/bg_torch_button.xml
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_selected="true">
                  <shape android:shape="oval">
                      <solid android:color="#F59E0B"/>
                      <stroke android:width="6dp" android:color="#FEF08A"/>
                      <size android:width="160dp" android:height="160dp"/>
                  </shape>
              </item>
              <item>
                  <shape android:shape="oval">
                      <solid android:color="#1E293B"/>
                      <stroke android:width="4dp" android:color="#334155"/>
                      <size android:width="160dp" android:height="160dp"/>
                  </shape>
              </item>
          </selector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_flashlight_on.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="64dp"
              android:height="64dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#0B0F19"
                  android:pathData="M18,2H6v6l3,3v11h6V11l3,-3V2zM13,13h-2v-3h2V13z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_flashlight_off.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="64dp"
              android:height="64dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#94A3B8"
                  android:pathData="M18,2H6v6l3,3v11h6V11l3,-3V2zM13,13h-2v-3h2V13z"/>
          </vector>
          EOF

          # 6. Icônes d'application pour l'écran d'accueil Android (ic_launcher et ic_launcher_round)
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M54,20L34,45h12v43h16V45h12z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_background.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#0B0F19" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lampe-Torche-Isaac-Le-Boss
          path: android/app/build/outputs/apk/debug/*.apk
