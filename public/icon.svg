<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fond sombre -->
  <rect width="512" height="512" rx="112" fill="#0b0f19"/>
  <circle cx="256" cy="256" r="230" fill="url(#halo)"/>

  <!-- Bordure néon -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Tête de lampe torche / Réflecteur -->
  <path d="M196 110 L316 110 L356 190 L156 190 Z" fill="url(#torchGrad)" stroke="#fef08a" stroke-width="6"/>

  <!-- Lentille lumineuse -->
  <ellipse cx="256" cy="110" rx="60" ry="16" fill="#ffffff"/>

  <!-- Corps torche -->
  <rect x="196" y="190" width="120" height="190" rx="16" fill="url(#bodyGrad)" stroke="#475569" stroke-width="6"/>

  <!-- Bouton d'alimentation central -->
  <circle cx="256" cy="270" r="28" fill="#f59e0b" stroke="#fef08a" stroke-width="4"/>
  <path d="M256 254 L256 270 M250 262 A10 10 0 1 0 262 262" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>

  <!-- Rainures de prise en main -->
  <line x1="210" y1="320" x2="302" y2="320" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="210" y1="340" x2="302" y2="340" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="210" y1="360" x2="302" y2="360" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  <!-- Embout inférieur -->
  <rect x="206" y="380" width="100" height="24" rx="8" fill="#1e293b" stroke="#334155" stroke-width="4"/>

  <!-- Rayons lumineux vers le haut -->
  <line x1="256" y1="80" x2="256" y2="40" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <line x1="200" y1="86" x2="166" y2="52" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <line x1="312" y1="86" x2="346" y2="52" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="106" x2="114" y2="82" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <line x1="362" y1="106" x2="398" y2="82" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
</svg>
